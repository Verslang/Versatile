name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Verslang compiler
        uses: actions/checkout@v4
        with:
          repository: Verslang/Verslang
          path: verslang-compiler

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Verslang compiler
        run: |
          cd verslang-compiler
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cl /std:c++20 /EHsc /O2 /I "src" /D_USE_MATH_DEFINES /DNOMINMAX /DVERSLANG_WINDOWS `
            src/main.cpp `
            src/lexer/lexer.cpp `
            src/parser/parser.cpp `
            src/codegen/x86_64.cpp `
            src/compiler/compiler.cpp `
            /Fe:"build/verslang.exe" /Fo:"build/"
          cd ..

      - name: Build Versatile Project
        run: |
          $env:PATH = "$PWD\verslang-compiler\build;$env:PATH"
          if (-not (Test-Path "build\output")) { New-Item -ItemType Directory -Force -Path "build\output" | Out-Null }

          Write-Host "[1/4] Building Bootstrap Compiler..."
          verslang verslang-bootstrap\lexer.vlang -o build\output\lexer.o -f obj
          verslang verslang-bootstrap\parser.vlang -o build\output\parser.o -f obj
          verslang verslang-bootstrap\codegen.vlang -o build\output\codegen.o -f obj
          verslang verslang-bootstrap\main.vlang -o build\output\main.o -f obj
          verslang -link build\output\main.o build\output\lexer.o build\output\parser.o build\output\codegen.o -o build\output\verslang-bootstrap.exe -f pe64
          Write-Host "  [OK] Bootstrap compiler built"

          Write-Host "[2/4] Building Native Modules..."
          verslang versscript-native\string_ops.vlang -o build\output\string_ops.o -f obj
          verslang versscript-native\math_engine.vlang -o build\output\math_engine.o -f obj
          verslang versscript-native\memory_pool.vlang -o build\output\memory_pool.o -f obj
          verslang versscript-native\json_parser.vlang -o build\output\json_parser.o -f obj
          verslang versscript-native\hash_table.vlang -o build\output\hash_table.o -f obj
          verslang -link -shared build\output\string_ops.o build\output\math_engine.o build\output\memory_pool.o build\output\json_parser.o build\output\hash_table.o -o build\output\versnative.dll
          Write-Host "  [OK] Native modules built"

          Write-Host "[3/4] Building Installers..."
          verslang installer\verslang-installer\installer-common.vlang -o build\output\installer-common.o -f obj
          verslang installer\verslang-installer\installer-windows.vlang -o build\output\installer-win.o -f obj
          verslang -link build\output\installer-common.o build\output\installer-win.o -o build\output\verslang-installer.exe -f pe64
          verslang installer\versatile-installer\installer.vlang -o build\output\versatile-installer.o -f obj
          verslang -link build\output\installer-common.o build\output\versatile-installer.o -o build\output\versatile-installer.exe -f pe64
          Write-Host "  [OK] Installers built"

          Write-Host "[4/4] Building Tests..."
          verslang tests\test_verslang.vlang -o build\output\test_verslang.exe -f pe64
          Write-Host "  [OK] Tests built"

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path versatile-windows-x64 | Out-Null
          Copy-Item build/output/verslang-bootstrap.exe versatile-windows-x64/
          Copy-Item build/output/versnative.dll versatile-windows-x64/
          Copy-Item build/output/verslang-installer.exe versatile-windows-x64/
          Copy-Item build/output/versatile-installer.exe versatile-windows-x64/
          Copy-Item build/output/test_verslang.exe versatile-windows-x64/
          Copy-Item README.md versatile-windows-x64/ -ErrorAction SilentlyContinue
          if (Test-Path verslang-bootstrap) { Copy-Item -Recurse verslang-bootstrap versatile-windows-x64/verslang-bootstrap }
          if (Test-Path versscript-native) { Copy-Item -Recurse versscript-native versatile-windows-x64/versscript-native }
          if (Test-Path tests) { Copy-Item -Recurse tests versatile-windows-x64/tests }
          Compress-Archive -Path versatile-windows-x64 -DestinationPath versatile-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: versatile-windows-x64
          path: versatile-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Verslang compiler
        uses: actions/checkout@v4
        with:
          repository: Verslang/Verslang
          path: verslang-compiler

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build Verslang compiler
        run: |
          cd verslang-compiler
          mkdir -p build-release && cd build-release
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
          make -j$(nproc)
          cd ../..

      - name: Build Versatile Project
        run: |
          export PATH="$PWD/verslang-compiler/build-release:$PATH"
          mkdir -p build/output

          echo "[1/4] Building Bootstrap Compiler..."
          verslang verslang-bootstrap/lexer.vlang -o build/output/lexer.o -f obj
          verslang verslang-bootstrap/parser.vlang -o build/output/parser.o -f obj
          verslang verslang-bootstrap/codegen.vlang -o build/output/codegen.o -f obj
          verslang verslang-bootstrap/main.vlang -o build/output/main.o -f obj
          verslang -link build/output/main.o build/output/lexer.o build/output/parser.o build/output/codegen.o -o build/output/verslang-bootstrap -f elf64
          echo "  [OK] Bootstrap compiler built"

          echo "[2/4] Building Native Modules..."
          verslang versscript-native/string_ops.vlang -o build/output/string_ops.o -f obj
          verslang versscript-native/math_engine.vlang -o build/output/math_engine.o -f obj
          verslang versscript-native/memory_pool.vlang -o build/output/memory_pool.o -f obj
          verslang versscript-native/json_parser.vlang -o build/output/json_parser.o -f obj
          verslang versscript-native/hash_table.vlang -o build/output/hash_table.o -f obj
          verslang -link -shared build/output/string_ops.o build/output/math_engine.o build/output/memory_pool.o build/output/json_parser.o build/output/hash_table.o -o build/output/libversnative.so
          echo "  [OK] Native modules built"

          echo "[3/4] Building Installers..."
          verslang installer/verslang-installer/installer-common.vlang -o build/output/installer-common.o -f obj
          verslang installer/verslang-installer/installer-linux.vlang -o build/output/installer-linux.o -f obj
          verslang -link build/output/installer-common.o build/output/installer-linux.o -o build/output/verslang-installer -f elf64
          echo "  [OK] Installers built"

          echo "[4/4] Building Tests..."
          verslang tests/test_verslang.vlang -o build/output/test_verslang -f elf64
          echo "  [OK] Tests built"

      - name: Package
        run: |
          mkdir -p versatile-linux-x64/bin
          cp build/output/verslang-bootstrap versatile-linux-x64/bin/
          cp build/output/libversnative.so versatile-linux-x64/bin/
          cp build/output/verslang-installer versatile-linux-x64/bin/
          cp build/output/test_verslang versatile-linux-x64/bin/
          chmod +x versatile-linux-x64/bin/*
          cp README.md versatile-linux-x64/ 2>/dev/null || true
          cp -r verslang-bootstrap versatile-linux-x64/verslang-bootstrap 2>/dev/null || true
          cp -r versscript-native versatile-linux-x64/versscript-native 2>/dev/null || true
          cp -r tests versatile-linux-x64/tests 2>/dev/null || true
          tar -czf versatile-linux-x64.tar.gz versatile-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: versatile-linux-x64
          path: versatile-linux-x64.tar.gz

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Verslang compiler
        uses: actions/checkout@v4
        with:
          repository: Verslang/Verslang
          path: verslang-compiler

      - name: Build Verslang compiler
        run: |
          cd verslang-compiler
          mkdir -p build-release && cd build-release
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
          make -j$(sysctl -n hw.ncpu)
          cd ../..

      - name: Build Versatile Project
        run: |
          export PATH="$PWD/verslang-compiler/build-release:$PATH"
          mkdir -p build/output

          echo "[1/3] Building Bootstrap Compiler..."
          verslang verslang-bootstrap/lexer.vlang -o build/output/lexer.o -f obj
          verslang verslang-bootstrap/parser.vlang -o build/output/parser.o -f obj
          verslang verslang-bootstrap/codegen.vlang -o build/output/codegen.o -f obj
          verslang verslang-bootstrap/main.vlang -o build/output/main.o -f obj
          verslang -link build/output/main.o build/output/lexer.o build/output/parser.o build/output/codegen.o -o build/output/verslang-bootstrap -f elf64
          echo "  [OK] Bootstrap compiler built"

          echo "[2/3] Building Native Modules..."
          verslang versscript-native/string_ops.vlang -o build/output/string_ops.o -f obj
          verslang versscript-native/math_engine.vlang -o build/output/math_engine.o -f obj
          verslang versscript-native/memory_pool.vlang -o build/output/memory_pool.o -f obj
          verslang versscript-native/json_parser.vlang -o build/output/json_parser.o -f obj
          verslang versscript-native/hash_table.vlang -o build/output/hash_table.o -f obj
          verslang -link -shared build/output/string_ops.o build/output/math_engine.o build/output/memory_pool.o build/output/json_parser.o build/output/hash_table.o -o build/output/libversnative.dylib
          echo "  [OK] Native modules built"

          echo "[3/3] Building Tests..."
          verslang tests/test_verslang.vlang -o build/output/test_verslang -f elf64
          echo "  [OK] Tests built"

      - name: Package
        run: |
          mkdir -p versatile-macos-arm64/bin
          cp build/output/verslang-bootstrap versatile-macos-arm64/bin/
          cp build/output/libversnative.dylib versatile-macos-arm64/bin/
          cp build/output/test_verslang versatile-macos-arm64/bin/
          chmod +x versatile-macos-arm64/bin/*
          cp README.md versatile-macos-arm64/ 2>/dev/null || true
          cp -r verslang-bootstrap versatile-macos-arm64/verslang-bootstrap 2>/dev/null || true
          cp -r versscript-native versatile-macos-arm64/versscript-native 2>/dev/null || true
          cp -r tests versatile-macos-arm64/tests 2>/dev/null || true
          tar -czf versatile-macos-arm64.tar.gz versatile-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: versatile-macos-arm64
          path: versatile-macos-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versatile-windows-x64/versatile-windows-x64.zip
            versatile-linux-x64/versatile-linux-x64.tar.gz
            versatile-macos-arm64/versatile-macos-arm64.tar.gz
          generate_release_notes: true
