name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Verslang compiler
        uses: actions/checkout@v4
        with:
          repository: Verslang/Verslang
          path: verslang-compiler

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Verslang compiler
        run: |
          cd verslang-compiler
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cl /std:c++20 /EHsc /O2 /I "src" /D_USE_MATH_DEFINES /DNOMINMAX /DVERSLANG_WINDOWS `
            src/main.cpp `
            src/lexer/lexer.cpp `
            src/parser/parser.cpp `
            src/codegen/x86_64.cpp `
            src/compiler/compiler.cpp `
            /Fe:"build/verslang.exe" /Fo:"build/"
          cd ..

      - name: Compile Verslang sources
        run: |
          $env:PATH = "$PWD\verslang-compiler\build;$env:PATH"
          if (-not (Test-Path "build\output")) { New-Item -ItemType Directory -Force -Path "build\output" | Out-Null }

          Write-Host "[1/3] Compiling Bootstrap Compiler sources..."
          verslang verslang-bootstrap\lexer.vlang -o build\output\bootstrap-lexer.exe
          verslang verslang-bootstrap\parser.vlang -o build\output\bootstrap-parser.exe
          verslang verslang-bootstrap\codegen.vlang -o build\output\bootstrap-codegen.exe
          verslang verslang-bootstrap\main.vlang -o build\output\bootstrap-main.exe
          Write-Host "  [OK] Bootstrap modules compiled"

          Write-Host "[2/3] Compiling Native Module sources..."
          verslang versscript-native\string_ops.vlang -o build\output\string_ops.exe
          verslang versscript-native\math_engine.vlang -o build\output\math_engine.exe
          verslang versscript-native\memory_pool.vlang -o build\output\memory_pool.exe
          verslang versscript-native\json_parser.vlang -o build\output\json_parser.exe
          verslang versscript-native\hash_table.vlang -o build\output\hash_table.exe
          Write-Host "  [OK] Native modules compiled"

          Write-Host "[3/3] Compiling Tests..."
          verslang tests\test_verslang.vlang -o build\output\test_verslang.exe
          Write-Host "  [OK] Tests compiled"

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path versatile-windows-x64 | Out-Null
          New-Item -ItemType Directory -Force -Path versatile-windows-x64\bin | Out-Null
          Copy-Item build\output\*.exe versatile-windows-x64\bin\
          Copy-Item verslang-compiler\build\verslang.exe versatile-windows-x64\bin\
          Copy-Item README.md versatile-windows-x64\ -ErrorAction SilentlyContinue
          if (Test-Path verslang-bootstrap) { Copy-Item -Recurse verslang-bootstrap versatile-windows-x64\verslang-bootstrap }
          if (Test-Path versscript-native) { Copy-Item -Recurse versscript-native versatile-windows-x64\versscript-native }
          if (Test-Path tests) { Copy-Item -Recurse tests versatile-windows-x64\tests }
          if (Test-Path installer) { Copy-Item -Recurse installer versatile-windows-x64\installer }
          Compress-Archive -Path versatile-windows-x64 -DestinationPath versatile-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: versatile-windows-x64
          path: versatile-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Verslang compiler
        uses: actions/checkout@v4
        with:
          repository: Verslang/Verslang
          path: verslang-compiler

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build Verslang compiler
        run: |
          cd verslang-compiler
          mkdir -p build-release && cd build-release
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
          make -j$(nproc)
          cd ../..

      - name: Compile Verslang sources
        run: |
          export PATH="$PWD/verslang-compiler/build-release:$PATH"
          mkdir -p build/output

          echo "[1/3] Compiling Bootstrap Compiler sources..."
          verslang verslang-bootstrap/lexer.vlang --format elf -o build/output/bootstrap-lexer
          verslang verslang-bootstrap/parser.vlang --format elf -o build/output/bootstrap-parser
          verslang verslang-bootstrap/codegen.vlang --format elf -o build/output/bootstrap-codegen
          verslang verslang-bootstrap/main.vlang --format elf -o build/output/bootstrap-main
          echo "  [OK] Bootstrap modules compiled"

          echo "[2/3] Compiling Native Module sources..."
          verslang versscript-native/string_ops.vlang --format elf -o build/output/string_ops
          verslang versscript-native/math_engine.vlang --format elf -o build/output/math_engine
          verslang versscript-native/memory_pool.vlang --format elf -o build/output/memory_pool
          verslang versscript-native/json_parser.vlang --format elf -o build/output/json_parser
          verslang versscript-native/hash_table.vlang --format elf -o build/output/hash_table
          echo "  [OK] Native modules compiled"

          echo "[3/3] Compiling Tests..."
          verslang tests/test_verslang.vlang --format elf -o build/output/test_verslang
          echo "  [OK] Tests compiled"

      - name: Package
        run: |
          mkdir -p versatile-linux-x64/bin
          cp build/output/* versatile-linux-x64/bin/ 2>/dev/null || true
          cp verslang-compiler/build-release/verslang versatile-linux-x64/bin/
          chmod +x versatile-linux-x64/bin/*
          cp README.md versatile-linux-x64/ 2>/dev/null || true
          cp -r verslang-bootstrap versatile-linux-x64/verslang-bootstrap 2>/dev/null || true
          cp -r versscript-native versatile-linux-x64/versscript-native 2>/dev/null || true
          cp -r tests versatile-linux-x64/tests 2>/dev/null || true
          cp -r installer versatile-linux-x64/installer 2>/dev/null || true
          tar -czf versatile-linux-x64.tar.gz versatile-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: versatile-linux-x64
          path: versatile-linux-x64.tar.gz

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Verslang compiler
        uses: actions/checkout@v4
        with:
          repository: Verslang/Verslang
          path: verslang-compiler

      - name: Build Verslang compiler
        run: |
          cd verslang-compiler
          mkdir -p build-release && cd build-release
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
          make -j$(sysctl -n hw.ncpu)
          cd ../..

      - name: Compile Verslang sources
        run: |
          export PATH="$PWD/verslang-compiler/build-release:$PATH"
          mkdir -p build/output

          echo "[1/3] Compiling Bootstrap Compiler sources..."
          verslang verslang-bootstrap/lexer.vlang --format elf -o build/output/bootstrap-lexer
          verslang verslang-bootstrap/parser.vlang --format elf -o build/output/bootstrap-parser
          verslang verslang-bootstrap/codegen.vlang --format elf -o build/output/bootstrap-codegen
          verslang verslang-bootstrap/main.vlang --format elf -o build/output/bootstrap-main
          echo "  [OK] Bootstrap modules compiled"

          echo "[2/3] Compiling Native Module sources..."
          verslang versscript-native/string_ops.vlang --format elf -o build/output/string_ops
          verslang versscript-native/math_engine.vlang --format elf -o build/output/math_engine
          verslang versscript-native/memory_pool.vlang --format elf -o build/output/memory_pool
          verslang versscript-native/json_parser.vlang --format elf -o build/output/json_parser
          verslang versscript-native/hash_table.vlang --format elf -o build/output/hash_table
          echo "  [OK] Native modules compiled"

          echo "[3/3] Compiling Tests..."
          verslang tests/test_verslang.vlang --format elf -o build/output/test_verslang
          echo "  [OK] Tests compiled"

      - name: Package
        run: |
          mkdir -p versatile-macos-arm64/bin
          cp build/output/* versatile-macos-arm64/bin/ 2>/dev/null || true
          cp verslang-compiler/build-release/verslang versatile-macos-arm64/bin/
          chmod +x versatile-macos-arm64/bin/*
          cp README.md versatile-macos-arm64/ 2>/dev/null || true
          cp -r verslang-bootstrap versatile-macos-arm64/verslang-bootstrap 2>/dev/null || true
          cp -r versscript-native versatile-macos-arm64/versscript-native 2>/dev/null || true
          cp -r tests versatile-macos-arm64/tests 2>/dev/null || true
          cp -r installer versatile-macos-arm64/installer 2>/dev/null || true
          tar -czf versatile-macos-arm64.tar.gz versatile-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: versatile-macos-arm64
          path: versatile-macos-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versatile-windows-x64/versatile-windows-x64.zip
            versatile-linux-x64/versatile-linux-x64.tar.gz
            versatile-macos-arm64/versatile-macos-arm64.tar.gz
          generate_release_notes: true
